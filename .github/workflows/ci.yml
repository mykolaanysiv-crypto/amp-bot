name: AMP CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Production gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: amp
          POSTGRES_PASSWORD: amp
          POSTGRES_DB: amp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amp -d amp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOT_TOKEN: 123456789:TEST_TOKEN_FOR_CI_ONLY_ABCDEFGHIJKLMNOPQRSTUVWXYZ
      WEB_SESSION_SECRET: ci-session-secret-ci-session-secret-1234567890
      DATABASE_URL: sqlite+aiosqlite:///./ci_amp.db
      TEST_DATABASE_URL: postgresql+asyncpg://amp:amp@127.0.0.1:5432/amp_test
      POSTGRES_SMOKE_URL: postgresql+asyncpg://amp:amp@127.0.0.1:5432/amp_test
      TIMEZONE: Europe/Kyiv
      APP_ENV: test
      LOG_FORMAT: text
      SUPERADMIN_IDS: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q app scripts migrations tests

      - name: Production preflight
        run: python -m scripts.production_preflight

      - name: Critical static checks
        run: ruff check --select E9,F63,F7,F82 app scripts tests

      - name: Admin JavaScript smoke
        run: node tests/js/test_admin_forms.js

      - name: Dependency vulnerability audit
        continue-on-error: true
        run: pip-audit -r requirements.txt --progress-spinner=off

      - name: Unit and regression tests
        run: pytest -q --ignore=tests/integration

      - name: PostgreSQL integration tests
        run: pytest -q tests/integration

      - name: Alembic previous-production + downgrade/upgrade gates
        run: |
          pytest -q \
            tests/integration/test_alembic_full_adoption.py::test_alembic_upgrade_from_previous_production_schema \
            tests/integration/test_alembic_full_adoption.py::test_latest_revision_downgrade_upgrade_roundtrip

      - name: Real release/startup smoke on PostgreSQL 18
        env:
          DATABASE_URL: postgresql+asyncpg://amp:amp@127.0.0.1:5432/amp_test
          AMP_STARTUP_SMOKE: "1"
        run: python -m scripts.heroku_release

      - name: Verify Alembic head on PostgreSQL 18
        env:
          DATABASE_URL: postgresql+asyncpg://amp:amp@127.0.0.1:5432/amp_test
        run: alembic current

      - name: Reject model/schema drift without Alembic revision
        env:
          DATABASE_URL: postgresql+asyncpg://amp:amp@127.0.0.1:5432/amp_test
        run: python -m scripts.schema_drift_check

  deploy:
    name: Deploy to Heroku after CI
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: amp
          POSTGRES_PASSWORD: amp
          POSTGRES_DB: amp_deploy_restore_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amp -d amp_deploy_restore_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      RESTORE_DATABASE_URL: postgresql://amp:amp@127.0.0.1:5432/amp_deploy_restore_verify
      AMP_ALLOW_TEMP_RESTORE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require Heroku deployment secrets
        shell: bash
        run: |
          test -n "$HEROKU_API_KEY" || { echo "HEROKU_API_KEY secret is required"; exit 1; }
          test -n "$HEROKU_APP_NAME" || { echo "HEROKU_APP_NAME secret is required"; exit 1; }

      - name: Install Heroku CLI and PostgreSQL client
        shell: bash
        run: |
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Ensure dedicated production field-encryption key
        shell: bash
        run: |
          set -euo pipefail
          SESSION_SECRET="$(heroku config:get WEB_SESSION_SECRET -a "$HEROKU_APP_NAME" | tr -d '\r\n')"
          FIELD_KEY="$(heroku config:get FIELD_ENCRYPTION_KEY -a "$HEROKU_APP_NAME" | tr -d '\r\n')"
          PREVIOUS_KEYS="$(heroku config:get FIELD_ENCRYPTION_PREVIOUS_KEYS -a "$HEROKU_APP_NAME" | tr -d '\r\n')"
          test "${#SESSION_SECRET}" -ge 32 || { echo "WEB_SESSION_SECRET is missing/too short"; exit 1; }

          if [ "${#FIELD_KEY}" -lt 32 ] || [ "$FIELD_KEY" = "$SESSION_SECRET" ]; then
            NEW_FIELD_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            case ",$PREVIOUS_KEYS," in
              *",$SESSION_SECRET,"*) UPDATED_PREVIOUS="$PREVIOUS_KEYS" ;;
              *) UPDATED_PREVIOUS="${PREVIOUS_KEYS:+$PREVIOUS_KEYS,}$SESSION_SECRET" ;;
            esac
            heroku config:set -a "$HEROKU_APP_NAME" \
              "FIELD_ENCRYPTION_KEY=$NEW_FIELD_KEY" \
              "FIELD_ENCRYPTION_PREVIOUS_KEYS=$UPDATED_PREVIOUS" >/dev/null
            echo "Dedicated FIELD_ENCRYPTION_KEY configured; legacy session key retained only in previous-key ring for migration."
          else
            echo "Dedicated FIELD_ENCRYPTION_KEY already configured."
          fi

      - name: Capture PostgreSQL backup before deploy
        shell: bash
        run: |
          set -euo pipefail
          heroku pg:backups:capture -a "$HEROKU_APP_NAME"
          heroku pg:backups -a "$HEROKU_APP_NAME" | sed -n '1,14p'

      - name: Restore-verify fresh pre-deploy backup; defer restore-verified marker
        shell: bash
        run: ./scripts/verify_backup_restore.sh "$HEROKU_APP_NAME"

      - name: Deploy tested commit to Heroku
        shell: bash
        run: |
          cat > "$HOME/.netrc" <<EOF
          machine git.heroku.com
            login _
            password $HEROKU_API_KEY
          EOF
          chmod 600 "$HOME/.netrc"
          git remote add heroku "https://git.heroku.com/${HEROKU_APP_NAME}.git"
          # Heroku is a deployment target, not the source-of-truth repository.
          # Force updates only the code ref and never touches PostgreSQL data.
          git push heroku HEAD:main --force

      - name: Post-deploy readiness and version smoke
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="$(heroku apps:info -a "$HEROKU_APP_NAME" --json | python -c 'import json,sys; print(json.load(sys.stdin).get("web_url", "").rstrip("/"))')"
          test -n "$APP_URL" || { echo "Could not resolve Heroku web URL"; exit 1; }
          echo "Checking $APP_URL"
          READY=0
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 10 "$APP_URL/health/ready" -o /tmp/amp-ready.json; then
              READY=1
              break
            fi
            echo "Readiness attempt $attempt/24 failed; retrying in 10s..."
            sleep 10
          done
          test "$READY" = "1" || { echo "Post-deploy /health/ready never became healthy"; exit 1; }
          curl -fsS --max-time 10 "$APP_URL/health/live" -o /tmp/amp-live.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = Path("VERSION.txt").read_text(encoding="utf-8").strip()
          live = json.loads(Path("/tmp/amp-live.json").read_text(encoding="utf-8"))
          ready = json.loads(Path("/tmp/amp-ready.json").read_text(encoding="utf-8"))
          if live.get("status") != "ok" or live.get("version") != expected:
              raise SystemExit(f"Live/version mismatch: expected={expected!r}, payload={live!r}")
          if ready.get("status") != "ready" or ready.get("version") != expected:
              raise SystemExit(f"Readiness/version mismatch: expected={expected!r}, payload={ready!r}")
          print(f"Post-deploy smoke PASS: version={expected}")
          PY

      - name: Record fresh restore-verified marker
        shell: bash
        run: |
          set -euo pipefail
          LABEL="Pre-deploy restore-verified PGBackup ${GITHUB_RUN_ID} $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          heroku run -a "$HEROKU_APP_NAME" -- python -m scripts.mark_backup_verified "$LABEL"
          heroku run -a "$HEROKU_APP_NAME" -- python -m scripts.verify_backup_marker

      - name: Re-encrypt legacy sensitive fields with dedicated key
        shell: bash
        run: heroku run -a "$HEROKU_APP_NAME" -- python -m scripts.rotate_field_encryption
