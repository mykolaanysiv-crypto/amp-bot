<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06B8C5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin.css?v=1.15.1">
  <title>Вхід • АМПасадори</title>
</head>
<body class="login-body">
  <div class="login-card">
    <img class="login-brand" src="/static/amp_logo.png?v=1.15.1" alt="АМПасадори">
    <h1>Панель керування</h1>
    <p>Анисівський молодіжний простір</p>
    <div class="login-security-note">🔐 Персональний доступ. Невдалі входи, чутливі перегляди та адміністративні зміни журналюються.</div>
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label>Логін<input name="username" required autocomplete="username"></label>
      <label>Пароль<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="primary" type="submit">Увійти</button>
    </form>
    <small class="security-footnote">Після 5 невдалих спроб вхід тимчасово блокується. Для суперадміністратора двоетапний вхід обов’язковий.</small>
  </div>
</body>
</html>
