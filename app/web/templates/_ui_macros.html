{% macro nav_link(href, label, icon_name, active=false) -%}
<a class="nav-item{% if active %} active{% endif %}" href="{{ href }}" title="{{ label }}"{% if active %} aria-current="page"{% endif %}>
  <span class="icon nav-icon">{{ icon(icon_name) }}</span><span class="nav-label">{{ label }}</span>
</a>
{%- endmacro %}
